<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:       #0a0e14;
  --card:     #121820;
  --card2:    #1a2230;
  --line:     #1e2d3d;
  --line2:    #263040;
  --accent:   #00d4a0;
  --blue:     #3b82f6;
  --red:      #f05252;
  --text:     #f0f4f8;
  --sub:      #8899aa;
  --dim:      #4a5a6a;
  --r:        12px;
  --r-sm:     8px;
  --font:     'Inter', system-ui, sans-serif;
  --mono:     'JetBrains Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; }
body { max-width:540px; margin:0 auto; padding:0 0 80px; }

/* Header */
.topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 16px 10px; }
.brand { font-size:22px; font-weight:700; letter-spacing:-.5px; color:var(--text); }
.brand span { color:var(--accent); }
.btn-refresh { background:var(--card2); border:1px solid var(--line); color:var(--accent); font-family:var(--font); font-size:13px; font-weight:600; padding:8px 14px; border-radius:var(--r-sm); cursor:pointer; display:flex; align-items:center; gap:6px; transition:background .15s; }
.btn-refresh:hover { background:var(--line); }
.btn-refresh.spinning .ri { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Hero total value */
.hero { padding:8px 16px 20px; }
.hero-label { font-size:12px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; }
.hero-value { font-size:40px; font-weight:700; letter-spacing:-1.5px; color:var(--text); line-height:1; font-family:var(--mono); }
.hero-change { display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:14px; font-weight:600; font-family:var(--mono); }
.hero-change.pos { color:var(--accent); }
.hero-change.neg { color:var(--red); }

/* Portfolio line chart */
.chart-card { margin:0 16px 16px; background:var(--card); border-radius:var(--r); border:1px solid var(--line); overflow:hidden; }
.chart-card-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 4px; }
.chart-card-title { font-size:13px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:1px; }
.range-row { display:flex; gap:4px; padding:8px 16px 12px; }
.rb { background:none; border:none; color:var(--sub); font-family:var(--mono); font-size:12px; font-weight:600; padding:5px 10px; border-radius:6px; cursor:pointer; transition:all .15s; }
.rb.on { background:var(--accent); color:#000; }
.chart-wrap { padding:0 4px 4px; height:130px; }

/* Stats row */
.stats-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 16px 16px; }
.stat-card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; }
.stat-label { font-size:11px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:6px; }
.stat-val { font-size:20px; font-weight:700; font-family:var(--mono); letter-spacing:-.5px; line-height:1.1; }
.stat-sub { font-size:11px; color:var(--sub); margin-top:3px; font-family:var(--mono); }

/* Section header */
.sec-head { display:flex; align-items:center; justify-content:space-between; padding:4px 16px 10px; }
.sec-title { font-size:16px; font-weight:700; color:var(--text); }
.btn-add { background:var(--accent); color:#000; border:none; font-family:var(--font); font-size:13px; font-weight:700; padding:8px 16px; border-radius:var(--r-sm); cursor:pointer; transition:background .15s; }
.btn-add:hover { background:#00c090; }

/* Position cards */
.pos-card { margin:0 16px 10px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; cursor:pointer; transition:border-color .15s; }
.pos-card:hover { border-color:var(--line2); }
.pos-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.pos-left { display:flex; align-items:center; gap:10px; }
.pos-badge { background:var(--card2); border:1px solid var(--line2); border-radius:6px; padding:5px 9px; font-family:var(--mono); font-size:13px; font-weight:700; color:var(--accent); }
.pos-name { font-size:13px; color:var(--sub); max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pos-price { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--text); }
.pos-bottom { display:flex; align-items:center; justify-content:space-between; }
.pos-detail { font-size:12px; color:var(--sub); }
.pill { display:inline-flex; align-items:center; padding:4px 10px; border-radius:20px; font-family:var(--mono); font-size:12px; font-weight:700; white-space:nowrap; }
.pill.pos { background:rgba(0,212,160,.15); color:var(--accent); }
.pill.neg { background:rgba(240,82,82,.15); color:var(--red); }
.pill.neu { background:var(--card2); color:var(--sub); }
.pos-pnl-row { display:flex; align-items:center; gap:8px; margin-top:6px; }
.mini-wrap { height:36px; }
canvas.mini { width:80px; height:36px; }

/* Add form */
.drawer { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.7); }
.drawer.open { display:flex; align-items:flex-end; }
.drawer-panel { background:var(--card); border-radius:20px 20px 0 0; width:100%; max-width:540px; margin:0 auto; padding:20px 20px 40px; border-top:1px solid var(--line); }
.drawer-handle { width:40px; height:4px; background:var(--line2); border-radius:4px; margin:0 auto 20px; }
.drawer-title { font-size:18px; font-weight:700; margin-bottom:4px; }
.drawer-hint { font-size:13px; color:var(--sub); margin-bottom:18px; line-height:1.5; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.field input { width:100%; background:var(--card2); border:1px solid var(--line2); color:var(--text); font-family:var(--mono); font-size:15px; padding:12px 14px; border-radius:var(--r-sm); outline:none; transition:border-color .15s; -webkit-appearance:none; }
.field input:focus { border-color:var(--accent); }
.field input::placeholder { color:var(--dim); }
.fields-row { display:flex; gap:10px; }
.fields-row .field { flex:1; }
.search-wrap { position:relative; }
.search-spinner { position:absolute; right:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; border:2px solid var(--line2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; display:none; }
.search-wrap.loading .search-spinner { display:block; }
.ac-drop { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--card2); border:1px solid var(--line2); border-radius:var(--r-sm); z-index:200; overflow:hidden; display:none; max-height:260px; overflow-y:auto; }
.ac-drop.open { display:block; }
.ac-row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .1s; }
.ac-row:last-child { border-bottom:none; }
.ac-row:hover, .ac-row.on { background:rgba(0,212,160,.07); }
.ac-sym { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--accent); min-width:72px; }
.ac-inf { flex:1; min-width:0; }
.ac-n { font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ac-ex { font-size:11px; color:var(--sub); font-family:var(--mono); margin-top:2px; }
.ac-tag { font-size:11px; font-family:var(--mono); padding:2px 8px; border-radius:20px; background:var(--card); color:var(--sub); border:1px solid var(--line); white-space:nowrap; }
.ac-tag.etf { color:var(--blue); border-color:rgba(59,130,246,.3); }
.ac-tag.eq  { color:var(--accent); border-color:rgba(0,212,160,.3); }
.ac-empty { padding:16px; text-align:center; font-size:13px; color:var(--sub); }
.sel-info { background:rgba(0,212,160,.07); border:1px solid rgba(0,212,160,.2); border-radius:var(--r-sm); padding:10px 14px; font-size:13px; font-family:var(--mono); color:var(--accent); margin-bottom:12px; display:none; }
.msg { font-size:13px; font-family:var(--mono); border-radius:var(--r-sm); padding:10px 14px; margin-bottom:12px; display:none; line-height:1.6; }
.msg.err { color:var(--red); background:rgba(240,82,82,.08); border:1px solid rgba(240,82,82,.2); }
.msg.inf { color:var(--accent); background:rgba(0,212,160,.06); border:1px solid rgba(0,212,160,.2); }
.drawer-btns { display:flex; gap:10px; margin-top:6px; }
.btn-ok { flex:1; background:var(--accent); color:#000; border:none; font-family:var(--font); font-size:15px; font-weight:700; padding:14px; border-radius:var(--r-sm); cursor:pointer; transition:background .15s; }
.btn-ok:hover { background:#00c090; }
.btn-cl { background:var(--card2); color:var(--sub); border:1px solid var(--line2); font-family:var(--font); font-size:15px; padding:14px 20px; border-radius:var(--r-sm); cursor:pointer; }

/* Detail drawer */
.detail-panel { background:var(--card); border-radius:20px 20px 0 0; width:100%; max-width:540px; margin:0 auto; padding:20px 20px 40px; border-top:1px solid var(--line); max-height:90vh; overflow-y:auto; }
.det-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.det-sym { font-family:var(--mono); font-size:22px; font-weight:700; color:var(--accent); }
.det-name { font-size:14px; color:var(--sub); margin-top:2px; }
.btn-del { background:rgba(240,82,82,.12); color:var(--red); border:1px solid rgba(240,82,82,.2); font-family:var(--font); font-size:13px; font-weight:600; padding:8px 14px; border-radius:var(--r-sm); cursor:pointer; }
.det-range { display:flex; gap:4px; margin-bottom:12px; }
.det-chart { height:160px; margin-bottom:16px; }
.det-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.det-stat { background:var(--card2); border-radius:var(--r-sm); padding:12px; }
.det-stat-label { font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; font-weight:600; }
.det-stat-val { font-size:16px; font-weight:700; font-family:var(--mono); }

/* Mock data btn */
.mock-bar { padding:0 16px 12px; }
.btn-mock { width:100%; background:var(--card2); border:1px solid var(--line); color:var(--sub); font-family:var(--font); font-size:13px; font-weight:600; padding:11px; border-radius:var(--r-sm); cursor:pointer; transition:all .15s; }
.btn-mock:hover { border-color:var(--accent); color:var(--accent); }

/* Empty */
.empty { text-align:center; padding:40px 20px; color:var(--sub); font-size:14px; line-height:2; }
.empty-ico { font-size:40px; display:block; margin-bottom:8px; }

/* Toast */
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line2); border-radius:var(--r-sm); padding:10px 18px; font-size:13px; font-family:var(--mono); color:var(--text); opacity:0; transition:opacity .2s; pointer-events:none; z-index:999; white-space:nowrap; }
.toast.show { opacity:1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Port<span>folio</span></div>
  <button class="btn-refresh" onclick="refreshAll()"><span class="ri">&#x21BB;</span> Verversen</button>
</div>

<!-- Hero -->
<div class="hero">
  <div class="hero-label">Totale waarde</div>
  <div class="hero-value" id="heroVal">&mdash;</div>
  <div class="hero-change pos" id="heroChange" style="display:none"></div>
</div>

<!-- Portfolio chart -->
<div class="chart-card">
  <div class="chart-card-header">
    <span class="chart-card-title">Portfolio waarde</span>
  </div>
  <div class="range-row">
    <button class="rb on" onclick="setPortRange('7d',this)">7D</button>
    <button class="rb" onclick="setPortRange('1mo',this)">1M</button>
    <button class="rb" onclick="setPortRange('3mo',this)">3M</button>
    <button class="rb" onclick="setPortRange('1y',this)">1J</button>
  </div>
  <div class="chart-wrap"><canvas id="portChart"></canvas></div>
</div>

<!-- Stats -->
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-label">Winst / Verlies</div>
    <div class="stat-val" id="statPnl">&mdash;</div>
    <div class="stat-sub" id="statPnlSub">&mdash;</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Vandaag</div>
    <div class="stat-val" id="statDay">&mdash;</div>
    <div class="stat-sub" id="statDaySub">&mdash;</div>
  </div>
</div>

<!-- Positions -->
<div class="sec-head">
  <span class="sec-title">Posities</span>
  <button class="btn-add" onclick="openAdd()">+ Toevoegen</button>
</div>

<div class="mock-bar">
  <button class="btn-mock" onclick="loadMockData()">&#x1F9EA; Testdata laden (5 aandelen)</button>
</div>

<div id="positionsList"></div>

<!-- Add drawer -->
<div class="drawer" id="addDrawer" onclick="handleDrawerBg(event,'addDrawer')">
  <div class="drawer-panel">
    <div class="drawer-handle"></div>
    <div class="drawer-title">Aandeel toevoegen</div>
    <div class="drawer-hint">Zoek op naam of ticker. Alle beurzen: AEX (.AS), XETRA (.HA/.DE), NYSE, Nasdaq, LSE (.L)</div>
    <div class="msg err" id="addErr"></div>
    <div class="msg inf" id="addInf"></div>
    <div class="field">
      <label>Zoeken *</label>
      <div class="search-wrap" id="swrap">
        <input type="text" class="search-input" id="inpSearch" placeholder="bijv. ASML, iShares MSCI, VWRL..." autocomplete="off">
        <div class="search-spinner"></div>
        <div class="ac-drop" id="acDrop"></div>
      </div>
    </div>
    <div class="sel-info" id="selInfo"></div>
    <div class="fields-row">
      <div class="field"><label>Aantal</label><input type="number" id="inpShares" placeholder="0" min="0" step="any"></div>
      <div class="field"><label>Aankoopprijs</label><input type="number" id="inpCost" placeholder="0.00" min="0" step="any"></div>
    </div>
    <div class="drawer-btns">
      <button class="btn-ok" onclick="addStock()">Toevoegen</button>
      <button class="btn-cl" onclick="closeAdd()">Annuleer</button>
    </div>
  </div>
</div>

<!-- Detail drawer -->
<div class="drawer" id="detDrawer" onclick="handleDrawerBg(event,'detDrawer')">
  <div class="detail-panel">
    <div class="drawer-handle"></div>
    <div class="det-header">
      <div>
        <div class="det-sym" id="detSym"></div>
        <div class="det-name" id="detName"></div>
      </div>
      <button class="btn-del" id="detDel">Verwijderen</button>
    </div>
    <div class="det-range">
      <button class="rb on" onclick="setDetRange('1mo',this)">1M</button>
      <button class="rb" onclick="setDetRange('3mo',this)">3M</button>
      <button class="rb" onclick="setDetRange('6mo',this)">6M</button>
      <button class="rb" onclick="setDetRange('1y',this)">1J</button>
      <button class="rb" onclick="setDetRange('5y',this)">5J</button>
    </div>
    <div class="det-chart"><canvas id="detChart"></canvas></div>
    <div class="det-stats" id="detStats"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var portfolio = JSON.parse(localStorage.getItem('pf_v4') || '[]');
var quotes = {};
var portHistory = {};
var portRange = '7d';
var detRange = '1mo';
var detTicker = '';
var portChartInst = null;
var detChartInst = null;
var selTicker = '', selName = '';
var acRes = [], acIdx = -1, srchTimer = null;

// ── Multi-proxy fetch ─────────────────────────────────────────────────────
var PROXIES = [
  function(u){ return 'https://corsproxy.io/?' + encodeURIComponent(u); },
  function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function(u){ return 'https://api.codetabs.com/v1/proxy?quest=' + u; }
];
async function fj(url) {
  for (var i=0;i<PROXIES.length;i++) {
    try {
      var ctrl = new AbortController();
      var t = setTimeout(function(){ctrl.abort();},7000);
      var r = await fetch(PROXIES[i](url),{signal:ctrl.signal});
      clearTimeout(t);
      if (!r.ok) continue;
      var tx = await r.text();
      if (!tx || tx.trim()[0]==='<') continue;
      return JSON.parse(tx);
    } catch(e){}
  }
  return null;
}
function save(){ localStorage.setItem('pf_v4',JSON.stringify(portfolio)); }

// ── Fetch quote ───────────────────────────────────────────────────────────
async function fetchQ(ticker) {
  var eps = [
    'https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range=2d',
    'https://query2.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range=2d',
    'https://query1.finance.yahoo.com/v7/finance/quote?symbols='+ticker,
    'https://query2.finance.yahoo.com/v7/finance/quote?symbols='+ticker
  ];
  for (var i=0;i<eps.length;i++) {
    var d = await fj(eps[i]);
    if (!d) continue;
    try {
      if (d.chart&&d.chart.result&&d.chart.result[0]) {
        var m = d.chart.result[0].meta;
        if (!m.regularMarketPrice) continue;
        var prev = m.chartPreviousClose||m.previousClose||m.regularMarketPrice;
        return {price:m.regularMarketPrice,prev:prev,change:m.regularMarketPrice-prev,changePct:(m.regularMarketPrice-prev)/prev*100,currency:m.currency||'EUR'};
      }
      if (d.quoteResponse&&d.quoteResponse.result&&d.quoteResponse.result[0]) {
        var q = d.quoteResponse.result[0];
        if (!q.regularMarketPrice) continue;
        var prev = q.regularMarketPreviousClose||q.regularMarketPrice;
        return {price:q.regularMarketPrice,prev:prev,change:q.regularMarketPrice-prev,changePct:(q.regularMarketPrice-prev)/prev*100,currency:q.currency||'EUR'};
      }
    } catch(e){}
  }
  return null;
}

// ── Fetch history ─────────────────────────────────────────────────────────
async function fetchHist(ticker, range) {
  var d = await fj('https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range='+range);
  if (!d) return [];
  try {
    var res = d.chart.result[0];
    var ts = res.timestamp, cl = res.indicators.quote[0].close;
    return ts.map(function(t,i){ return {t:t,v:cl[i]?+cl[i].toFixed(2):null}; }).filter(function(p){return p.v!==null;});
  } catch(e){ return []; }
}

// ── Mini sparkline ────────────────────────────────────────────────────────
async function drawMini(canvas, ticker, color) {
  var d = await fj('https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range=1mo');
  if (!d) return;
  try {
    var cl = d.chart.result[0].indicators.quote[0].close.filter(function(c){return c!==null;}).map(function(c){return +c.toFixed(2);});
    if (!cl.length) return;
    var ctx = canvas.getContext('2d'), w=canvas.width, h=canvas.height;
    var mn=Math.min.apply(null,cl), mx=Math.max.apply(null,cl), rng=mx-mn||1;
    ctx.clearRect(0,0,w,h);
    ctx.beginPath();
    cl.forEach(function(v,i){ var x=(i/(cl.length-1))*w, y=h-((v-mn)/rng)*(h-4)-2; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.stroke();
    ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
    var g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,color+'33'); g.addColorStop(1,color+'00');
    ctx.fillStyle=g; ctx.fill();
  } catch(e){}
}

// ── Search ────────────────────────────────────────────────────────────────
async function searchSym(q) {
  var d = await fj('https://query1.finance.yahoo.com/v1/finance/search?q='+encodeURIComponent(q)+'&lang=en-US&region=NL&quotesCount=10&newsCount=0&listsCount=0');
  if (!d) return [];
  return (d.quotes||[]).filter(function(r){ return r.symbol&&['EQUITY','ETF','MUTUALFUND'].indexOf(r.quoteType)>=0; });
}

function onSearch() {
  var v = document.getElementById('inpSearch').value;
  clearTimeout(srchTimer);
  selTicker=''; selName='';
  document.getElementById('selInfo').style.display='none';
  document.getElementById('addErr').style.display='none';
  document.getElementById('addInf').style.display='none';
  var wrap=document.getElementById('swrap'), drop=document.getElementById('acDrop');
  if (!v||v.length<1){ drop.classList.remove('open'); wrap.classList.remove('loading'); return; }
  wrap.classList.add('loading');
  srchTimer=setTimeout(async function(){
    acRes=await searchSym(v);
    wrap.classList.remove('loading');
    renderAC(acRes,v);
  },300);
}

function tagHtml(t){ if(t==='ETF')return '<span class="ac-tag etf">ETF</span>'; if(t==='EQUITY')return '<span class="ac-tag eq">Aandeel</span>'; return '<span class="ac-tag">'+t+'</span>'; }

function renderAC(res, q) {
  var drop=document.getElementById('acDrop'); acIdx=-1;
  if (!res.length){ drop.innerHTML='<div class="ac-empty">Geen resultaten voor "'+q+'"</div>'; drop.classList.add('open'); return; }
  drop.innerHTML=res.map(function(r,i){ var name=r.longname||r.shortname||r.symbol, ex=r.exchDisp||'';
    return '<div class="ac-row" data-i="'+i+'" onmousedown="pickAC('+i+')"><div class="ac-sym">'+r.symbol+'</div><div class="ac-inf"><div class="ac-n">'+name+'</div><div class="ac-ex">'+ex+'</div></div>'+tagHtml(r.quoteType)+'</div>';
  }).join(''); drop.classList.add('open');
}

function pickAC(i) {
  var r=acRes[i]; if(!r)return;
  selTicker=r.symbol; selName=r.longname||r.shortname||r.symbol;
  document.getElementById('inpSearch').value=r.symbol+' \u2014 '+selName;
  document.getElementById('acDrop').classList.remove('open');
  var si=document.getElementById('selInfo'); si.textContent='\u2713 '+selTicker+' \u2014 '+selName; si.style.display='block';
  document.getElementById('inpShares').focus();
}

// ── Add / Remove ──────────────────────────────────────────────────────────
function openAdd() {
  document.getElementById('inpSearch').value='';
  document.getElementById('inpShares').value='';
  document.getElementById('inpCost').value='';
  document.getElementById('selInfo').style.display='none';
  document.getElementById('addErr').style.display='none';
  document.getElementById('addInf').style.display='none';
  document.getElementById('acDrop').classList.remove('open');
  selTicker=''; selName='';
  document.getElementById('addDrawer').classList.add('open');
  setTimeout(function(){ document.getElementById('inpSearch').focus(); },100);
}
function closeAdd(){ document.getElementById('addDrawer').classList.remove('open'); }

async function addStock() {
  var ticker=selTicker, name=selName;
  var shares=parseFloat(document.getElementById('inpShares').value)||0;
  var cost=parseFloat(document.getElementById('inpCost').value)||0;
  var err=document.getElementById('addErr'), inf=document.getElementById('addInf');
  err.style.display='none'; inf.style.display='none';
  if (!ticker){ err.textContent='Selecteer eerst een aandeel via de zoekbalk.'; err.style.display='block'; return; }
  if (portfolio.find(function(p){return p.ticker===ticker;})){ err.textContent=ticker+' staat al in je portfolio.'; err.style.display='block'; return; }
  inf.textContent='Koers ophalen voor '+ticker+'\u2026'; inf.style.display='block';
  var q=await fetchQ(ticker);
  inf.style.display='none';
  if (!q) {
    var st=ticker.replace(/'/g,"\\'"), sn=name.replace(/'/g,"\\'");
    err.innerHTML='Koers voor <b>'+ticker+'</b> niet beschikbaar via proxy.<br><a style="color:var(--blue);cursor:pointer" onmousedown="forceAdd(\''+st+'\',\''+sn+'\','+shares+','+cost+')">Toch toevoegen &rarr;</a>';
    err.style.display='block'; return;
  }
  quotes[ticker]=q;
  portfolio.push({ticker:ticker,name:name,shares:shares,costBasis:cost});
  save(); closeAdd(); render();
  showToast(ticker+' toegevoegd');
}

function forceAdd(t,n,s,c){
  if (portfolio.find(function(p){return p.ticker===t;})) return;
  portfolio.push({ticker:t,name:n,shares:s,costBasis:c});
  save(); closeAdd(); render();
}

function removeStock(ticker) {
  portfolio=portfolio.filter(function(p){return p.ticker!==ticker;});
  save(); document.getElementById('detDrawer').classList.remove('open'); render();
  showToast(ticker+' verwijderd');
}

// ── Refresh ───────────────────────────────────────────────────────────────
async function refreshAll() {
  var btn=document.querySelector('.btn-refresh');
  btn.classList.add('spinning'); btn.disabled=true;
  var tickers=portfolio.map(function(p){return p.ticker;}).filter(function(t,i,a){return a.indexOf(t)===i;});
  await Promise.all(tickers.map(async function(t){ var q=await fetchQ(t); if(q) quotes[t]=q; }));
  render();
  document.querySelector('.topbar .btn-refresh').title='Bijgewerkt '+new Date().toLocaleTimeString('nl-NL');
  btn.classList.remove('spinning'); btn.disabled=false;
  showToast('Koersen bijgewerkt');
}

// ── Format ────────────────────────────────────────────────────────────────
function fmtN(n,d){ if(n==null||isNaN(n))return '\u2014'; d=d!==undefined?d:2; return n.toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtC(n,cur){ if(n==null||isNaN(n))return '\u2014'; var s=cur==='USD'?'$':cur==='GBP'?'\u00a3':'\u20ac'; return s+fmtN(Math.abs(n)); }
function pctStr(n){ if(n==null)return '\u2014'; return (n>=0?'+':'')+fmtN(n)+'%'; }

// ── Render positions ──────────────────────────────────────────────────────
function render() {
  renderHero();
  renderPositions();
  renderPortChart();
}

function renderHero() {
  var total=0, totalCost=0, dayAbs=0, hasVal=false;
  portfolio.forEach(function(pos){
    var q=quotes[pos.ticker]; if(!q||!pos.shares)return;
    total+=q.price*pos.shares; dayAbs+=q.change*pos.shares; hasVal=true;
    if(pos.costBasis) totalCost+=pos.shares*pos.costBasis;
  });
  if (!hasVal) { document.getElementById('heroVal').textContent='\u2014'; return; }
  document.getElementById('heroVal').textContent='\u20ac'+fmtN(total);
  var hc=document.getElementById('heroChange');
  hc.style.display='flex';
  var dc=dayAbs>=0?'pos':'neg';
  hc.className='hero-change '+dc;
  hc.textContent=(dayAbs>=0?'+':'')+'\u20ac'+fmtN(Math.abs(dayAbs))+' vandaag';

  // Stats
  var sp=document.getElementById('statPnl'), ss=document.getElementById('statPnlSub');
  var sd=document.getElementById('statDay'), sds=document.getElementById('statDaySub');
  if (totalCost>0) {
    var pnl=total-totalCost, pnlPct=(pnl/totalCost)*100;
    sp.className='stat-val '+(pnl>=0?'pos':'neg');
    sp.textContent=(pnl>=0?'+':'-')+'\u20ac'+fmtN(Math.abs(pnl));
    ss.textContent=pctStr(pnlPct);
  } else { sp.textContent='\u2014'; ss.textContent='Geen aankoopprijs'; }
  sd.className='stat-val '+(dayAbs>=0?'pos':'neg');
  sd.textContent=(dayAbs>=0?'+':'-')+'\u20ac'+fmtN(Math.abs(dayAbs));
  var dp=portfolio.filter(function(p){return quotes[p.ticker];}); 
  var avgPct=dp.length?dp.reduce(function(s,p){return s+quotes[p.ticker].changePct;},0)/dp.length:0;
  sds.textContent=pctStr(avgPct)+' gem.';
}

function renderPositions() {
  var el=document.getElementById('positionsList');
  if (!portfolio.length) { el.innerHTML='<div class="empty"><span class="empty-ico">&#x1F4CA;</span>Voeg je eerste positie toe</div>'; return; }
  el.innerHTML='';
  portfolio.forEach(function(pos,i) {
    var q=quotes[pos.ticker];
    var price=q?q.price:null, cur=q?q.currency:'EUR';
    var cp=q?q.changePct:null;
    var val=(price&&pos.shares)?price*pos.shares:null;
    var cost=(pos.shares&&pos.costBasis)?pos.shares*pos.costBasis:null;
    var pnl=(val&&cost)?val-cost:null;
    var pnlPct=(pnl!==null&&cost)?(pnl/cost)*100:null;

    var div=document.createElement('div');
    div.className='pos-card';
    div.onclick=function(){ openDetail(pos.ticker); };

    var cpCls=cp===null?'neu':cp>=0?'pos':'neg';
    var pnlCls=pnl===null?'neu':pnl>=0?'pos':'neg';

    div.innerHTML=
      '<div class="pos-top">'+
        '<div class="pos-left"><span class="pos-badge">'+pos.ticker+'</span><span class="pos-name">'+(pos.name||'')+'</span></div>'+
        '<span class="pos-price">'+(price?fmtC(price,cur):'\u2014')+'</span>'+
      '</div>'+
      '<div class="pos-bottom">'+
        '<div>'+
          '<div class="pos-detail">'+(pos.shares?fmtN(pos.shares,pos.shares%1===0?0:4)+' aand.':'')+' '+(cost?'&bull; \u20ac'+fmtN(cost/pos.shares):'')+'</div>'+
          '<div class="pos-pnl-row">'+
            '<span class="pill '+cpCls+'">'+(cp!==null?(cp>=0?'+':'')+fmtN(cp)+'%':'\u2014')+'</span>'+
            (pnl!==null?'<span class="pill '+pnlCls+'">'+(pnl>=0?'+':'-')+'&euro;'+fmtN(Math.abs(pnl))+'</span>':'')+''+
          '</div>'+
        '</div>'+
        '<div class="mini-wrap"><canvas class="mini" id="mini'+i+'" width="80" height="36"></canvas></div>'+
      '</div>';
    el.appendChild(div);

    var c=document.getElementById('mini'+i);
    if (c) drawMini(c, pos.ticker, (cp||0)>=0?'#00d4a0':'#f05252');
  });
}

// ── Portfolio chart (simulated from positions) ────────────────────────────
async function renderPortChart() {
  if (!portfolio.length) return;
  // Fetch history for all positions and combine
  var rangeMap={'7d':'5d','1mo':'1mo','3mo':'3mo','1y':'1y'};
  var range=rangeMap[portRange]||'1mo';
  
  // Get histories for all holdings
  var allHist=await Promise.all(portfolio.filter(function(p){return p.shares>0;}).map(async function(pos){
    var hist=await fetchHist(pos.ticker,range);
    return {pos:pos, hist:hist};
  }));

  // Build unified timeline using all timestamps
  var tsSet={};
  allHist.forEach(function(item){ item.hist.forEach(function(p){ tsSet[p.t]=true; }); });
  var timestamps=Object.keys(tsSet).map(Number).sort(function(a,b){return a-b;});
  if (!timestamps.length) return;

  // For each timestamp compute total portfolio value
  var vals=timestamps.map(function(ts){
    var total=0, ok=true;
    allHist.forEach(function(item){
      if (!item.pos.shares){return;}
      // find closest point
      var best=null, bestD=Infinity;
      item.hist.forEach(function(p){ var d=Math.abs(p.t-ts); if(d<bestD){bestD=d;best=p;} });
      if (best&&bestD<86400*3) total+=best.v*item.pos.shares;
      else ok=false;
    });
    return ok||true?total:null;
  }).filter(function(v){return v!==null&&v>0;});

  var lbls=timestamps.slice(timestamps.length-vals.length).map(function(ts){
    var d=new Date(ts*1000);
    return portRange==='7d'?d.toLocaleDateString('nl-NL',{weekday:'short'}):d.toLocaleDateString('nl-NL',{month:'short',day:'numeric'});
  });

  var isPos=vals.length>1&&vals[vals.length-1]>=vals[0];
  var col=isPos?'#00d4a0':'#f05252';
  var ctx=document.getElementById('portChart').getContext('2d');
  if (portChartInst) portChartInst.destroy();
  portChartInst=new Chart(ctx,{
    type:'line',
    data:{labels:lbls,datasets:[{data:vals,borderColor:col,
      backgroundColor:function(c){var g=c.chart.ctx.createLinearGradient(0,0,0,130);g.addColorStop(0,col+'44');g.addColorStop(1,col+'00');return g;},
      borderWidth:2,pointRadius:0,tension:.3,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' \u20ac'+fmtN(c.parsed.y);}},
        backgroundColor:'#121820',borderColor:'#1e2d3d',borderWidth:1,bodyColor:'#f0f4f8',bodyFont:{family:'JetBrains Mono',size:11}}},
      scales:{x:{grid:{color:'#1e2d3d'},ticks:{color:'#8899aa',font:{family:'JetBrains Mono',size:9},maxTicksLimit:portRange==='7d'?7:6}},
              y:{grid:{color:'#1e2d3d'},ticks:{color:'#8899aa',font:{family:'JetBrains Mono',size:9},callback:function(v){return '\u20ac'+fmtN(v,0);}}}}}
  });
}

function setPortRange(r,btn){
  portRange=r;
  document.querySelectorAll('.range-row .rb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  renderPortChart();
}

// ── Detail drawer ─────────────────────────────────────────────────────────
async function openDetail(ticker) {
  detTicker=ticker;
  var pos=portfolio.find(function(p){return p.ticker===ticker;});
  var q=quotes[ticker];
  document.getElementById('detSym').textContent=ticker;
  document.getElementById('detName').textContent=pos?pos.name:'';
  document.getElementById('detDel').onclick=function(){ removeStock(ticker); };

  // Reset range buttons
  document.querySelectorAll('.det-range .rb').forEach(function(b){b.classList.remove('on');});
  document.querySelector('.det-range .rb').classList.add('on');
  detRange='1mo';

  // Stats
  var statsEl=document.getElementById('detStats');
  var price=q?q.price:null, cur=q?q.currency:'EUR';
  var val=(price&&pos&&pos.shares)?price*pos.shares:null;
  var cost=(pos&&pos.shares&&pos.costBasis)?pos.shares*pos.costBasis:null;
  var pnl=(val&&cost)?val-cost:null;
  var pnlPct=(pnl!==null&&cost)?(pnl/cost)*100:null;
  statsEl.innerHTML=[
    {l:'Koers',v:price?fmtC(price,cur):'\u2014',c:q?(q.changePct>=0?'pos':'neg'):''},
    {l:'Dag',v:q?pctStr(q.changePct):'\u2014',c:q?(q.changePct>=0?'pos':'neg'):''},
    {l:'Waarde',v:val?fmtC(val,cur):'\u2014',c:''},
    {l:'W/V',v:pnl!==null?(pnl>=0?'+':'-')+fmtC(Math.abs(pnl),cur)+(pnlPct!==null?' ('+pctStr(pnlPct)+')':''):'\u2014',c:pnl!==null?(pnl>=0?'pos':'neg'):''}
  ].map(function(s){
    return '<div class="det-stat"><div class="det-stat-label">'+s.l+'</div><div class="det-stat-val '+(s.c||'')+'">'+s.v+'</div></div>';
  }).join('');

  document.getElementById('detDrawer').classList.add('open');
  loadDetChart();
}

async function loadDetChart() {
  var data=await fetchHist(detTicker,detRange);
  var vals=data.map(function(p){return p.v;});
  var lbls=data.map(function(p){ var d=new Date(p.t*1000); return d.toLocaleDateString('nl-NL',{month:'short',day:'numeric'}); });
  var isPos=vals.length>1&&vals[vals.length-1]>=vals[0];
  var col=isPos?'#00d4a0':'#f05252';
  var ctx=document.getElementById('detChart').getContext('2d');
  if (detChartInst) detChartInst.destroy();
  detChartInst=new Chart(ctx,{
    type:'line',
    data:{labels:lbls,datasets:[{data:vals,borderColor:col,
      backgroundColor:function(c){var g=c.chart.ctx.createLinearGradient(0,0,0,160);g.addColorStop(0,col+'44');g.addColorStop(1,col+'00');return g;},
      borderWidth:2,pointRadius:0,tension:.3,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' '+fmtN(c.parsed.y);}},
        backgroundColor:'#121820',borderColor:'#1e2d3d',borderWidth:1,bodyColor:'#f0f4f8',bodyFont:{family:'JetBrains Mono',size:11}}},
      scales:{x:{grid:{color:'#1e2d3d'},ticks:{color:'#8899aa',font:{family:'JetBrains Mono',size:9},maxTicksLimit:6}},
              y:{grid:{color:'#1e2d3d'},ticks:{color:'#8899aa',font:{family:'JetBrains Mono',size:9}}}}}
  });
}

function setDetRange(r,btn){
  detRange=r;
  document.querySelectorAll('.det-range .rb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  loadDetChart();
}

// ── Drawer background close ───────────────────────────────────────────────
function handleDrawerBg(e,id){
  if (e.target===document.getElementById(id)) document.getElementById(id).classList.remove('open');
}

// ── Mock data ─────────────────────────────────────────────────────────────
var MOCK=[
  {ticker:'ASML.AS',name:'ASML Holding',shares:5,costBasis:650},
  {ticker:'NVDA',name:'NVIDIA Corporation',shares:10,costBasis:450},
  {ticker:'VWRL.AS',name:'Vanguard FTSE All-World ETF',shares:50,costBasis:105},
  {ticker:'AAPL',name:'Apple Inc.',shares:15,costBasis:165},
  {ticker:'IQQY.HA',name:'iShares Core MSCI Europe ETF',shares:20,costBasis:58}
];

async function loadMockData() {
  var btn=document.querySelector('.btn-mock');
  btn.textContent='Laden\u2026'; btn.disabled=true;
  for (var i=0;i<MOCK.length;i++) {
    var m=MOCK[i];
    if (!portfolio.find(function(p){return p.ticker===m.ticker;})) {
      portfolio.push({ticker:m.ticker,name:m.name,shares:m.shares,costBasis:m.costBasis});
    }
  }
  save();
  await refreshAll();
  btn.textContent='&#x1F9EA; Testdata laden (5 aandelen)'; btn.disabled=false;
}

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}

// ── Keyboard ──────────────────────────────────────────────────────────────
document.getElementById('inpSearch').addEventListener('input',onSearch);
document.addEventListener('keydown',function(e){
  var drop=document.getElementById('acDrop');
  var items=drop.querySelectorAll('.ac-row');
  var open=drop.classList.contains('open');
  if (open&&items.length){
    if (e.key==='ArrowDown'){e.preventDefault();acIdx=Math.min(acIdx+1,items.length-1);items.forEach(function(el,i){el.classList.toggle('on',i===acIdx);});return;}
    if (e.key==='ArrowUp'){e.preventDefault();acIdx=Math.max(acIdx-1,0);items.forEach(function(el,i){el.classList.toggle('on',i===acIdx);});return;}
    if (e.key==='Enter'&&acIdx>=0){e.preventDefault();e.stopPropagation();pickAC(acIdx);return;}
  }
  var addOpen=document.getElementById('addDrawer').classList.contains('open');
  if (e.key==='Enter'&&addOpen&&!open){addStock();return;}
  if (e.key==='Escape'){document.getElementById('addDrawer').classList.remove('open');document.getElementById('detDrawer').classList.remove('open');}
});
document.addEventListener('click',function(e){ if(!e.target.closest('#swrap'))document.getElementById('acDrop').classList.remove('open'); });

// ── Init ──────────────────────────────────────────────────────────────────
render();
if (portfolio.length>0) refreshAll();
</script>
